name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FINALPACKAGE: 1

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot xz-utils make
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          $THEOS/bin/ldid -h 2>&1 | head -2 || true
          ls "$THEOS/sdks" | head

      - name: Build package
        run: |
          make package FINALPACKAGE=1 DEBUG=0
          ls -la packages/

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp packages/*.deb out/
          find .theos -name 'XunleiEnhance.dylib' -exec cp {} out/ \;
          find .theos -name 'XunleiEnhancePrefs' -type f -exec cp {} out/XunleiEnhancePrefs.bundle.bin \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: XunleiEnhance-${{ github.sha }}
          path: out/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
